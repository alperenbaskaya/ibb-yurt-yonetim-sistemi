global:
  scrape_interval: 2s
  evaluation_interval: 2s

scrape_configs:
  - job_name: "yurtlar-backend"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets:
          - "host.docker.internal:8081"

  - job_name: "kafka-exporter"
    static_configs:
      - targets:
          - "kafka-exporter:9308"
