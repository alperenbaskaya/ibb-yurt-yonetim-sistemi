spring.application.name=yurtlar

# STRUCTURED FILE LOGGING (console remains human-readable)
logging.file.name=${APP_LOG_FILE:logs/yurtlar.json}
logging.structured.format.file=logstash
logging.structured.json.add.service=${spring.application.name}
logging.structured.json.add.environment=${APP_ENVIRONMENT:local}

# ACTUATOR / METRICS
management.server.port=${MANAGEMENT_SERVER_PORT:8081}
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# DISTRIBUTED TRACING (metrics remain Prometheus-scraped; logs remain file-based)
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.tracing.export.otlp.enabled=${OTLP_TRACING_ENABLED:true}
management.opentelemetry.tracing.export.otlp.transport=http
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.resource-attributes.service.name=yurtlar-backend
management.opentelemetry.resource-attributes.deployment.environment=${APP_ENVIRONMENT:local}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:1s}
spring.data.redis.timeout=${REDIS_TIMEOUT:1s}

# ELASTICSEARCH
spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}
app.elasticsearch.audit-index=${AUDIT_ELASTICSEARCH_INDEX:yurtlar-audit-log-v1}

app.file-storage.upload-dir=uploads

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

# KAFKA
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.consumer.group-id=yurtlar-learning-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer


# OUTBOX PUBLISHER
outbox.publisher.fixed-delay-ms=2000
outbox.publisher.initial-delay-ms=3000
